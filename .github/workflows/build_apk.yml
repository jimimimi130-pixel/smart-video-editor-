name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip libtool libtool-bin \
            autoconf automake m4 pkg-config zlib1g-dev libncurses-dev \
            libncurses6 cmake libffi-dev libssl-dev file wget curl

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip wheel setuptools\<80
          python3 -m pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Cache Buildozer and Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'main.py', 'smart_editor_core.py') }}
          restore-keys: |
            buildozer-v4-${{ runner.os }}-

      - name: Build APK with Buildozer
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          rm -rf .buildozer ~/.buildozer/android/platform/build-*/build/other_builds/libffi
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
